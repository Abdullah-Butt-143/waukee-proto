id: school_import
label: 'Waukee schools (scraped from waukeeschools.org)'
migration_group: waukee
# PoC: no path alias is set below on purpose. Nodes land at /node/<nid> only.
# The live site already serves /schools and /schools/{school} from GROUP
# entities (scripts/phase17_schools_data.php) — do NOT alias these nodes to
# the same paths without first deciding which data model is authoritative.
source:
  plugin: csv
  # Produced by: node scripts/migration/scrape-schools.mjs
  # This is the path INSIDE the ddev web container (project root is mounted
  # at /var/www/html; the docroot web/ is /var/www/html/web). Confirm with
  # `ddev ssh` + `ls /var/www/html/scripts/migration/output/` before running.
  path: '/var/www/html/scripts/migration/output/schools.csv'
  delimiter: ','
  enclosure: '"'
  header_row_count: 1
  track_changes: true
  ids:
    - slug
process:
  type:
    plugin: default_value
    default_value: school
  title: name
  field_school_type: school_type
  field_grades: grades
  field_address: address
  field_phone: phone
  field_attendance_phone: attendance_phone
  field_fax: fax
  field_hours: hours
  field_early_dismissal: early_dismissal
  field_principal_name: principal_name
  field_principal_bio/value: principal_bio
  field_principal_bio/format:
    plugin: default_value
    default_value: basic_html
  field_staff:
    plugin: delimited_paragraphs
    source: staff
    bundle: staff_member
    record_delimiter: ';;'
    field_delimiter: '|'
    field_map:
      0: field_staff_name
      1: field_staff_role
      2: field_staff_email
  field_announcements:
    plugin: delimited_paragraphs
    source: announcements
    bundle: school_announcement
    record_delimiter: ';;'
    field_delimiter: '|'
    field_map:
      0: field_announcement_title
      1: field_announcement_link
destination:
  plugin: 'entity:node'
  default_bundle: school
migration_dependencies: {  }
