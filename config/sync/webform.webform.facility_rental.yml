id: facility_rental
title: 'Facility rental request'
description: 'Request a school room or field for a community event. (Sample form for the prototype.)'
categories: {  }
elements: |-
  contact:
    '#type': fieldset
    '#title': 'Your contact details'
    name:
      '#type': textfield
      '#title': 'Full name'
      '#required': true
    organization:
      '#type': textfield
      '#title': Organization
    email:
      '#type': email
      '#title': Email
      '#required': true
    phone:
      '#type': tel
      '#title': Phone
  event:
    '#type': fieldset
    '#title': 'Your event'
    school:
      '#type': select
      '#title': School
      '#options':
        elementary: 'Sample Elementary'
        high: 'Sample High School'
      '#empty_option': '- Select a school -'
      '#required': true
    room:
      '#type': select
      '#title': 'Room or facility'
      '#options':
        gym: Gymnasium
        auditorium: Auditorium
        cafeteria: Cafeteria
        classroom: Classroom
        field: 'Athletic field'
      '#empty_option': '- Select a room -'
      '#required': true
    event_date:
      '#type': date
      '#title': 'Event date'
      '#required': true
    start_time:
      '#type': webform_time
      '#title': 'Start time'
      '#required': true
    end_time:
      '#type': webform_time
      '#title': 'End time'
      '#required': true
    attendees:
      '#type': number
      '#title': 'Expected attendees'
      '#min': 1
      '#required': true
  room_options:
    '#type': fieldset
    '#title': 'Room options'
    '#description': 'These questions depend on the room you picked.'
    auditorium_stage:
      '#type': checkbox
      '#title': 'We need stage and lighting setup'
      '#states':
        visible:
          ':input[name="room"]':
            value: auditorium
    auditorium_seating:
      '#type': radios
      '#title': 'Seating layout'
      '#options':
        theater: Theater
        banquet: Banquet
      '#states':
        visible:
          ':input[name="room"]':
            value: auditorium
        required:
          ':input[name="room"]':
            value: auditorium
    cafeteria_kitchen:
      '#type': checkbox
      '#title': 'We need kitchen access'
      '#states':
        visible:
          ':input[name="room"]':
            value: cafeteria
    cafeteria_tables:
      '#type': number
      '#title': 'Number of tables needed'
      '#min': 0
      '#states':
        visible:
          ':input[name="room"]':
            value: cafeteria
    gym_equipment:
      '#type': checkboxes
      '#title': 'Gym equipment'
      '#options':
        bleachers: 'Open bleachers'
        scoreboard: Scoreboard
        sound: 'Sound system'
      '#states':
        visible:
          ':input[name="room"]':
            value: gym
    classroom_av:
      '#type': checkbox
      '#title': 'We need a projector and screen'
      '#states':
        visible:
          ':input[name="room"]':
            value: classroom
    field_lights:
      '#type': checkbox
      '#title': 'We need field lights (evening event)'
      '#states':
        visible:
          ':input[name="room"]':
            value: field
  notes:
    '#type': textarea
    '#title': 'Anything else we should know?'
  agreement:
    '#type': checkbox
    '#title': 'I have read and agree to the facility use policy.'
    '#required': true
