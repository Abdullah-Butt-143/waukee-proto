id: volunteer_hours
title: 'Volunteer hours'
description: 'Log community service hours for verification. (Sample form for the prototype.)'
categories: {  }
elements: |-
  student:
    '#type': fieldset
    '#title': 'Student'
    student_name:
      '#type': textfield
      '#title': 'Student name'
      '#required': true
    email:
      '#type': email
      '#title': 'Student or parent email'
      '#required': true
    school:
      '#type': select
      '#title': School
      '#options':
        elementary: 'Sample Elementary'
        high: 'Sample High School'
      '#empty_option': '- Select a school -'
      '#required': true
  service:
    '#type': fieldset
    '#title': 'Service'
    organization:
      '#type': textfield
      '#title': 'Organization served'
      '#required': true
    activity_type:
      '#type': select
      '#title': 'Type of activity'
      '#options':
        tutoring: Tutoring
        cleanup: 'Community cleanup'
        food_drive: 'Food drive'
        other: Other
      '#empty_option': '- Select an activity -'
      '#required': true
    activity_other:
      '#type': textfield
      '#title': 'Please describe the activity'
      '#states':
        visible:
          ':input[name="activity_type"]':
            value: other
        required:
          ':input[name="activity_type"]':
            value: other
    service_date:
      '#type': date
      '#title': 'Date of service'
      '#required': true
    hours:
      '#type': number
      '#title': 'Hours served'
      '#min': 0.25
      '#max': 24
      '#step': 0.25
      '#required': true
  supervisor:
    '#type': fieldset
    '#title': 'Supervisor who can verify these hours'
    supervisor_name:
      '#type': textfield
      '#title': 'Supervisor name'
      '#required': true
    supervisor_email:
      '#type': email
      '#title': 'Supervisor email'
      '#required': true
